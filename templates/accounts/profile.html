{% extends 'base.html' %}
{% block title %}账户信息{% endblock %}
{% block content %}
<section class="auth-card account-form-card">
    <h1>账户信息</h1>
    <dl class="profile-info">
        <div><dt>ID</dt><dd>{{ user.account_id }} <small class="muted">不可修改</small></dd></div>
        <div><dt>权限组</dt><dd>{{ user.permission_group.name }}</dd></div>
    </dl>
    <p class="muted">密码留空时仅更新昵称。修改密码需验证当前密码。</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {% include 'accounts/fields.html' %}
        <button class="button" type="submit">保存账户信息</button>
    </form>
</section>
{% endblock %}
